name: Optimize Autconsult woman image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-autconsult-image.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert PNG to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('autconsult_woman_cropped.png').convert('RGB')
          im.save('autconsult_woman_cropped.webp','WEBP',quality=82,method=6)
          PY
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autconsult_woman_cropped.webp
          git diff --cached --quiet || (git commit -m "Add optimized WebP image" && git push)
